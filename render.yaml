services:
  - type: web
    name: pharmacy-order-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pharmacy-order-db
          property: connectionString
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PHARMACY_API_KEY
        sync: false
      - key: CHORD_API_KEY
        sync: false
      - key: CHORD_WORKSPACE_ID
        sync: false
      - key: CHORD_TEAMMATE_ID
        sync: false
      - key: CHORD_CONVERSATION_ID
        sync: false

databases:
  - name: pharmacy-order-db
    plan: free
    databaseName: pharmacy_orders
    user: pharmacy_app
