services:
  - type: web
    name: pharmacy-order-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pharmacy-order-db
          property: connectionString

databases:
  - name: pharmacy-order-db
    plan: free
    databaseName: pharmacy_orders
    user: pharmacy_app
